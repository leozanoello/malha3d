/var/log/zanoello3d/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 www-data www-data
    postrotate
        # Recarrega PM2 para usar novos arquivos de log
        /usr/local/bin/pm2 reloadLogs /var/www/zanoello3d/ecosystem.config.js || true
        # Recarrega Nginx
        systemctl reload nginx || true
    endscript
}

