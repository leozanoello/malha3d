name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter (warnings only)
      run: npm run lint -- --max-warnings=9999 || true
      continue-on-error: true

    - name: Verify routes compile
      run: node -e "require('./routes/admin'); console.log('✅ Routes compile OK')"
      env:
        NODE_ENV: test

    - name: Verify Handlebars templates
      run: |
        node -e "
        const h = require('handlebars');
        const fs = require('fs');
        const path = require('path');
        const dir = 'views/admin/';
        const files = fs.readdirSync(dir).filter(f => f.endsWith('.hbs'));
        let ok = 0, fail = 0;
        files.forEach(f => {
          try { h.compile(fs.readFileSync(path.join(dir, f), 'utf8'))({}); ok++; }
          catch(e) { fail++; }
        });
        console.log(ok + '/' + files.length + ' templates OK');
        if (fail > files.length * 0.5) { process.exit(1); }
        "
      env:
        NODE_ENV: test

    - name: Run tests
      run: npm test -- --passWithNoTests --forceExit
      env:
        NODE_ENV: test
        SESSION_SECRET: test-secret-key-12345
        JWT_SECRET: test-jwt-secret
      continue-on-error: true

    - name: Build check
      run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install production dependencies
      run: npm ci --production

    - name: Create deployment package
      run: |
        tar -czf deploy.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='coverage' \
          --exclude='.nyc_output' \
          --exclude='tests' \
          --exclude='*.log' \
          --exclude='data/dev.sqlite' \
          .

    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: deploy.tar.gz
        retention-days: 7

    - name: Deploy to production
      if: github.ref == 'refs/heads/main'
      run: |
        echo "✅ Deploy artifact ready"
        echo "📦 Package: deploy.tar.gz"
        echo "🚀 Deploy manually or configure hosting provider webhook"
